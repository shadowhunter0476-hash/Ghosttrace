<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GhostTrace — Forgot Password</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#0a0e1a;font-family:'Inter','Segoe UI',sans-serif;color:#e6edf3}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 60% at 20% 0%, rgba(59,130,246,.15) 0%, transparent 55%),
  radial-gradient(ellipse 70% 60% at 80% 100%, rgba(139,92,246,.12) 0%, transparent 55%);
  pointer-events:none}
.wrap{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:rgba(13,17,28,.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:36px 32px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.logo h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,#60a5fa,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:18px;font-weight:700;text-align:center;margin-bottom:6px}
.sub{color:#8b949e;font-size:13px;text-align:center;margin-bottom:24px;line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:#8b949e;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#e6edf3;font-size:14px;font-family:inherit;outline:none;transition:all .2s}
.field input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:0;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(59,130,246,.4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
#msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px;padding:8px;border-radius:8px}
#msg.err{color:#f87171;background:rgba(248,113,113,.1)}
#msg.ok{color:#4ade80;background:rgba(74,222,128,.1)}
.back{text-align:center;margin-top:20px}
.back a{color:#8b949e;text-decoration:none;font-size:13px}
.back a:hover{color:#60a5fa}
.credit-box{margin-top:20px;padding:12px;background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.06));border:1px solid rgba(96,165,250,.3);border-radius:10px;text-align:center;font-size:12px;letter-spacing:1.5px}
.credit-txt{color:#8b949e;font-size:10px;letter-spacing:2px}
.credit-name{color:#60a5fa;font-size:15px;font-weight:900;letter-spacing:2px;text-shadow:0 0 12px #3b82f6;margin:0 4px}
.credit-tg{display:inline-block;color:#a78bfa;text-decoration:none;font-weight:700;padding:3px 10px;margin-left:6px;border:1px solid #8b5cf6;border-radius:6px;font-size:11px}
.credit-tg:hover{background:#8b5cf6;color:#fff}
</style></head>
<body><div class="wrap"><div class="card">

<div class="logo"><div class="logo-icon">👻</div><h1>GhostTrace</h1></div>
<h2>🔑 Reset Password</h2>
<div class="sub">Enter your email — we'll send a reset link.<br>New here? Reset link will be sent within 5 minutes.</div>

<div class="field">
  <label>Email</label>
  <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
</div>

<button class="btn" id="submitBtn" onclick="submit()">Send Reset Link</button>
<div id="msg"></div>

<div class="back"><a href="/login">← Back to Login</a></div>

<div class="credit-box">
  <span class="credit-txt">MADE BY</span>
  <b class="credit-name">AFTAB</b>
  <a href="https://t.me/shadow0476" class="credit-tg">✈️ @shadow0476</a>
</div>

</div></div>
<script>
function showMsg(text,ok){const m=document.getElementById('msg');m.textContent=text;m.className=ok?'ok':'err';}
async function submit(){
  const email=document.getElementById('email').value.trim();
  if(!email||!email.includes('@'))return showMsg('Enter a valid email',false);
  document.getElementById('submitBtn').disabled=true;
  try{
    const r=await fetch('/api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const j=await r.json();
    if(j.error)return showMsg(j.error,false);
    showMsg('If this email exists, reset link has been sent.',true);
    document.getElementById('email').value='';
  }catch(e){showMsg('Network error',false);}
  finally{document.getElementById('submitBtn').disabled=false;}
}
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
</script>
</body></html>
